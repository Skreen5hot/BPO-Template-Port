  - property: https://fandaws.com/ontology/bpot#pcfID   # the element IDs
    source: APQC Process Classification Framework
    release: v7.4
    licence: LicenseRef-APQC-PCF
    attribution: ©2024 APQC. ALL RIGHTS RESERVED. This Process Classification Framework® (“PCF”) is the copyrighted intellectual property of APQC. APQC encourages the wide distribution, discussion, and use of the PCF for classifying and defining organizational processes. Accordingly, APQC hereby grants you a perpetual, worldwide, royalty-free license to use, copy, publish, modify, and create derivative works of the PCF, provided that all copies of the PCF and any derivative works contain a copy of this notice.
  - property: https://fandaws.com/ontology/bpot#hierarchyID   # the hierarchy IDs
